<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body style="display: flex; height: 100vh; margin: 0;text-align: center;">
    <script src="util.js"></script>
    <div id="leftBar" style="height: 100%;width: 20%;background-color: blue;">
        <h1>YGE6</h1>
        <div>
            <button id="openFileButton">Open File</button>
        </div>
    </div>
    <div id="main">
        <div id="startGuide" style="height: 300px;width: 250px;background-color: lightgray;position: fixed;justify-content: center;align-items: center; top: 20%; left: 50%;text-align: center;">
            <h3>Start Guide</h3>
            <div style="display: flex;">
                <div style="width: 50%;">
                    <div id="needList" style="width: 100%;height: 100px;"></div>
                    <button onclick="util.choseTagDialog().then(tagName => {if (tagName) needList.add(tagName);})">+</button>
                    <button onclick="needList.remove(needList.getChose())">-</button>
                </div>
                <div style="width: 50%;">
                    <div id="needNotList" style="width: 100%;height: 100px;"></div>
                    <button onclick="util.choseTagDialog().then(tagName => {if (tagName) needNotList.add(tagName);})">+</button>
                    <button onclick="needNotList.remove(needNotList.getChose())">-</button>
                </div>
            </div>
            <div>
                <select id="count">
                    <option value="4">4</option>
                    <option value="9">9</option>
                    <option value="16">16</option>
                    <option value="20">20</option>
                </select>
            </div>
            <button>OK!</button>
        </div>
    </div>
    <script>
        const needList = new util.listWidget(document.getElementById("needList"));
        const needNotList = new util.listWidget(document.getElementById("needNotList"));
    </script>
</body>
</html>
